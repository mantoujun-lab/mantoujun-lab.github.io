version: 2

updates:
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Shanghai'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'bun'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    rebase-strategy: 'auto'
    groups:
      bun-patch:
        patterns:
          - '*'
        update-types:
          - 'patch'
      bun-minor:
        patterns:
          - '*'
        update-types:
          - 'minor'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Shanghai'
    open-pull-requests-limit: 3
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'ci'
      include: 'scope'
    rebase-strategy: 'auto'
    groups:
      actions-patch:
        patterns:
          - '*'
        update-types:
          - 'patch'
      actions-minor:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'