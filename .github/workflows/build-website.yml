name: Build Website

# 触发条件：
# - push 到 main：自动构建并部署到 GitHub Pages
# - paths：仅当源码、配置、依赖或工作流自身变更时触发
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-website.yml'

# 构建产物需要 pages:write / id-token:write 用于部署
permissions:
  contents: read
  pages: write
  id-token: write

# 防止并发触发（避免 Pages 部署竞态）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Job 1: 构建站点并上传 GitHub Pages artifact
  build:
    name: Build & Upload Artifact
    runs-on: ubuntu-latest
    steps:
      # ---------- Step 1: 检出代码 ----------
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      # ---------- Step 2: 安装 Node.js ----------
      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      # ---------- Step 3: 安装依赖 ----------
      # 使用 npm ci 保证 lockfile 一致性（适合 CI）
      - name: Install dependencies
        run: npm ci

      # ---------- Step 4: 配置 Pages ----------
      # 自动写入 .github/config/pages.yml（如不存在）并输出 base_url 等
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6.0.0

      # ---------- Step 5: 构建 Astro 站点 ----------
      # astro.config.mjs 的 vite plugin 会在 closeBundle 时自动压缩 public/ 图片
      - name: Build Astro site
        run: npm run build
        env:
          # 若将来需要 base path 注入，可在环境变量里读取 GITHUB_REPOSITORY_NAME
          NODE_ENV: production

      # ---------- Step 6: 上传 Pages artifact ----------
      # 仅上传 dist/；artifact 名称必须以 github-pages 开头
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./dist

  # Job 2: 部署到 GitHub Pages
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    # 使用官方 Pages 部署环境（需在 repo Settings -> Pages 中启用）
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0